# Ajustes comunes a los temas claro y oscuro (FlatLaf los fusiona con los de cada tema)
@accentColor = #1B8AC9

Button.arc = 10
Component.arc = 10
TextComponent.arc = 10
CheckBox.arc = 6
ProgressBar.arc = 999
ScrollBar.thumbArc = 999
ScrollBar.trackArc = 999
ScrollBar.width = 12
ScrollPane.border = 0,0,0,0
SplitPane.dividerSize = 1
Table.rowHeight = 44
Table.showHorizontalLines = true
Table.showVerticalLines = false
Table.intercellSpacing = 0,1
Table.cellMargins = 2,12,2,12
TableHeader.height = 34
TableHeader.separatorColor = #00000000
TableHeader.cellMargins = 2,12,2,12
Table.selectionInactiveBackground = $Table.selectionBackground
Popup.borderCornerRadius = 10
PopupMenu.borderCornerRadius = 10
MenuItem.selectionArc = 8
MenuItem.selectionInsets = 1,3,1,3

# Botón por defecto relleno con el acento (FlatLaf 3 lo dibuja solo con borde)
Button.default.background = $Component.accentColor
Button.default.foreground = #ffffff
Button.default.borderColor = $Component.accentColor
Button.default.focusedBackground = lighten($Component.accentColor,5%)
Button.default.hoverBackground = lighten($Component.accentColor,5%)
Button.default.pressedBackground = darken($Component.accentColor,6%)
Button.default.focusColor = $Component.accentColor
